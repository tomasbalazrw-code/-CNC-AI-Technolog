<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101a">
<title>CNC AI Technológ</title>
<style>
:root{--bg:#070d15;--card:#101c29;--line:#29465c;--text:#f4f7fb;--muted:#9eb1c2;--blue:#1597f5;--green:#24c77a;--red:#ff3434;--yellow:#f3c84b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:920px;margin:auto;padding:24px 14px 150px}
header{display:flex;align-items:center;gap:14px;margin:8px 0 20px}.logo{font-size:32px}.title{font-size:25px;font-weight:800}.subtitle{color:var(--muted);font-size:14px;margin-top:3px}
.card{background:linear-gradient(180deg,#111f2c,#0e1a26);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
h1{font-size:28px;margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}p{color:var(--muted);line-height:1.5}
label{display:block;font-size:16px;font-weight:700;margin:15px 0 8px}
input,select,textarea{width:100%;border:1px solid #31516a;border-radius:16px;background:#091520;color:var(--text);padding:14px 15px;font-size:17px;outline:none}
textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed #287ca8;border-radius:19px;background:#081620;padding:24px;text-align:center;cursor:pointer}.file-name{margin-top:8px;color:var(--muted);word-break:break-word}
button{border:0;border-radius:16px;padding:16px 18px;font-size:17px;font-weight:800;color:white;background:var(--blue);cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}.full{width:100%;margin-top:18px}
.status{display:none;border-radius:18px;padding:16px;margin-top:16px;border:1px solid var(--line);background:#0a1722;line-height:1.5}
.status.show{display:block}.status.error{border-color:#8c2929}.status.ok{border-color:#236b4d}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #6c8497;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
.result-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item,.tool{background:#091520;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.k{color:#8fa7b9;font-size:13px;margin-bottom:5px}.v{font-size:16px;line-height:1.45}
.tool strong{display:block;margin-bottom:5px}.tool span{color:var(--muted);line-height:1.45}
pre{white-space:pre-wrap;word-break:break-word;background:#061019;border:1px solid var(--line);border-radius:16px;padding:15px;overflow:auto;font-size:13px;line-height:1.5}
.notice{background:#17212a;border-left:4px solid var(--yellow);padding:12px 14px;border-radius:10px;color:#cbd7e0;line-height:1.5}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(6,13,21,.96);backdrop-filter:blur(16px);border-top:1px solid #243d50;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:20}
.bottom-inner{max-width:920px;margin:auto;display:flex;gap:4px}.bottom button{flex:1;padding:10px 5px;font-size:12px;background:transparent;border:0;color:#91a4b4}.bottom button.active{color:#27a5ff}
@media(max-width:650px){.row,.grid{grid-template-columns:1fr}.app{padding:18px 12px 145px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🔍</div><div><div class="title">CNC AI TECHNOLÓG</div><div class="subtitle">Technologická analýza výkresu</div></div></header>

<section class="card">
<h1>Analýza výkresu</h1>
<p>Nahraj PDF alebo fotografiu výkresu. AI má z výkresu určiť geometriu, postup obrábania, konkrétne nástroje, rezné parametre a návrh CNC programu.</p>

<label>Výkres</label>
<div class="drop" id="drop">
  <div style="font-size:34px">📄</div><strong>Vybrať výkres</strong>
  <div class="file-name" id="fileName">PDF / JPG / PNG</div>
  <input id="file" type="file" accept=".pdf,image/jpeg,image/png,image/webp" hidden>
</div>

<div class="row">
<div><label>Typ obrábania</label><select id="operation"><option>Sústruženie</option><option>Frézovanie</option><option>Vŕtanie</option></select></div>
<div><label>Materiál</label><input id="material" placeholder="napr. C45, S355, 42CrMo4"></div>
</div>
<div class="row">
<div><label>Polotovar</label><input id="stock" placeholder="napr. D220/275 alebo 60x120"></div>
<div><label>Riadiaci systém</label><input id="controller" placeholder="napr. FANUC, Siemens 840D"></div>
</div>
<label>Ďalšie požiadavky</label>
<textarea id="notes" placeholder="Tolerancie, drsnosť, dostupné nástroje, špeciálne požiadavky..."></textarea>

<button class="full" id="analyze">🤖 Spustiť AI analýzu</button>
<div class="status" id="status"></div>
</section>

<section class="card hidden" id="resultCard"><h2>🤖 Výsledok AI analýzy</h2><div id="result"></div></section>
</div>

<div class="bottom"><div class="bottom-inner">
<button class="active">⌂<br>DOMOV</button><button>⌕<br>ANALÝZA</button><button>＋<br>NOVÁ ZÁKAZKA</button><button>▣<br>KALKULAČKA</button><button>♙<br>PROFIL</button>
</div></div>

<script>
const $=id=>document.getElementById(id);let selectedFile=null;
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>{selectedFile=e.target.files[0]||null;$("fileName").textContent=selectedFile?selectedFile.name:"PDF / JPG / PNG"};
$("drop").ondragover=e=>e.preventDefault();
$("drop").ondrop=e=>{e.preventDefault();selectedFile=e.dataTransfer.files[0]||null;$("fileName").textContent=selectedFile?selectedFile.name:"PDF / JPG / PNG"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function first(...v){return v.find(x=>x!==undefined&&x!==null&&x!=="")}function arr(v){return Array.isArray(v)?v:[]}
function render(data){
 const a=data.analysis||data.result||data;let h=[];
 if(first(a.summary,a.zhrnutie,a.popis))h.push(`<div class="notice">${esc(first(a.summary,a.zhrnutie,a.popis))}</div>`);
 h.push(`<div class="result-section"><h2>⚙️ Upnutie a nastavenie</h2><div class="grid">`);
 [["Upnutie",first(a.fixturing,a.upnutie)],["Nulový bod",first(a.zero_point,a.nulovy_bod,a.datum)],["Podpery",first(a.supports,a.podpery)],["Riziká",first(a.risks,a.rizika)]].forEach(x=>{if(x[1])h.push(`<div class="item"><div class="k">${x[0]}</div><div class="v">${esc(x[1])}</div></div>`)});
 h.push(`</div></div>`);
 const ops=arr(first(a.operations,a.operacie,a.technology,a.technologia));
 h.push(`<div class="result-section"><h2>🛠️ Technologický postup</h2>`);
 if(ops.length)ops.forEach((o,i)=>{if(typeof o==="string")h.push(`<div class="item"><div class="k">Operácia ${i+1}</div><div class="v">${esc(o)}</div></div>`);else h.push(`<div class="item"><div class="k">Operácia ${i+1}</div><div class="v"><b>${esc(first(o.name,o.nazov,""))}</b><br>${esc(first(o.description,o.popis,o.details,""))}</div></div>`)});
 else h.push(`<div class="notice">Backend nevrátil technologické operácie.</div>`);h.push(`</div>`);
 const tools=arr(first(a.tools,a.nastroje));h.push(`<div class="result-section"><h2>🔧 Presné nástroje</h2>`);
 if(tools.length)tools.forEach(t=>{if(typeof t==="string")h.push(`<div class="tool"><strong>${esc(t)}</strong></div>`);else h.push(`<div class="tool"><strong>${esc(first(t.code,t.kod,t.name,t.nazov,"Nástroj"))}</strong><span>${esc(first(t.description,t.popis,t.holder,t.drzak,""))}${first(t.insert,t.platok)?`<br>Plátok: ${esc(first(t.insert,t.platok))}`:""}</span></div>`)});
 else h.push(`<div class="notice">Konkrétne označenia nástrojov neboli v odpovedi.</div>`);h.push(`</div>`);
 const params=arr(first(a.cutting_parameters,a.rezne_parametre,a.parameters));
 h.push(`<div class="result-section"><h2>📐 Režné parametre</h2><div class="grid">`);
 if(params.length)params.forEach(p=>{if(typeof p==="string")h.push(`<div class="item"><div class="v">${esc(p)}</div></div>`);else h.push(`<div class="item"><div class="k">${esc(first(p.tool,p.nastroj,"Nástroj"))}</div><div class="v">Vc: ${esc(first(p.vc,p.Vc,"—"))}<br>n: ${esc(first(p.rpm,p.n,"—"))} ot/min<br>f: ${esc(first(p.feed,p.f,"—"))}</div></div>`)});
 else h.push(`<div class="item"><div class="v">Parametre neboli v odpovedi.</div></div>`);h.push(`</div></div>`);
 const program=first(a.cnc_program,a.cncProgram,a.program,a.gcode);h.push(`<div class="result-section"><h2>💻 CNC program</h2>`);
 if(program)h.push(`<pre>${esc(program)}</pre>`);else h.push(`<div class="notice">CNC program nebol v odpovedi. Program má byť vytvorený až po overení geometrie, nulového bodu, upnutia a nástrojov.</div>`);
 h.push(`</div>`);$("result").innerHTML=h.join("");$("resultCard").classList.remove("hidden");$("resultCard").scrollIntoView({behavior:"smooth"});
}
function setStatus(type,msg){const s=$("status");s.className="status show "+type;s.innerHTML=msg}
$("analyze").onclick=async()=>{
 if(!selectedFile){setStatus("error","❌ Najprv vyber výkres.");return}
 const btn=$("analyze");btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Analyzujem výkres…';setStatus("","<span class='spinner'></span>Výkres sa odosiela na /api/analyze…");
 try{
  const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(selectedFile)});
  const payload={file:{name:selectedFile.name,type:selectedFile.type||"application/octet-stream",data:dataUrl},operation:$("operation").value,material:$("material").value.trim(),stock:$("stock").value.trim(),controller:$("controller").value.trim(),notes:$("notes").value.trim()};
  const r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
  const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={error:text||"Server nevrátil JSON."}}
  if(!r.ok)throw new Error(data.error||data.message||`Server vrátil HTTP ${r.status}`);
  setStatus("ok","✅ AI analýza dokončená.");render(data);
 }catch(e){
  console.error(e);setStatus("error",`❌ AI analýza zlyhala.<br><br><b>${esc(e.message)}</b><br><br>Ak sa zobrazí chyba <b>404</b>, na Verceli chýba <b>/api/analyze</b>. Ak sa zobrazí chyba kľúča, treba nastaviť <b>OPENAI_API_KEY</b> vo Verceli.`);
 }finally{btn.disabled=false;btn.innerHTML="🤖 Spustiť AI analýzu"}
};
</script>
</body>
</html>
