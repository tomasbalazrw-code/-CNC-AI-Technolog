<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>CNC AI Technológ V3</title>
<style>
:root{
  --bg:#05080d;--panel:#0b121c;--panel2:#101b28;--line:#24445f;
  --text:#f4f7fb;--muted:#aab7c6;--blue:#159ff5;--blue2:#087cf0;
  --orange:#ff9f25;--green:#70df52;--red:#ff4d4d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:760px;margin:auto;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
header{
  padding:22px 18px 18px;
  background:linear-gradient(180deg,#07101a,#05080d);
  border-bottom:1px solid #162737;
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.logo{font-size:29px;font-weight:900;letter-spacing:-1.2px}
.logo span{color:var(--blue)}
.sub{margin-top:5px;color:var(--muted);font-size:14px}
main{padding:16px}
.card{
  background:linear-gradient(180deg,rgba(16,27,40,.98),rgba(10,18,28,.98));
  border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.22)
}
h2{font-size:19px;margin:0 0 15px}
label{display:block;font-size:14px;font-weight:800;color:#dfe7ef;margin:0 0 7px}
.field{margin-bottom:14px}
input[type=text],select,textarea{
  width:100%;border:1px solid #31536e;border-radius:15px;
  background:#07111b;color:var(--text);outline:none;
  padding:14px 15px;font-size:16px
}
textarea{min-height:105px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,159,245,.12)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{
  border:1.5px dashed #3b6684;border-radius:17px;padding:18px;text-align:center;
  background:#07111b;transition:.2s
}
.drop.drag{border-color:var(--blue);background:#091b2a}
.drop input{display:none}
.dropBtn{
  display:inline-block;background:#10283b;border:1px solid #2e607f;border-radius:12px;
  padding:11px 16px;color:#fff;font-weight:800
}
.fileName{margin-top:9px;color:#8ea2b6;font-size:13px;word-break:break-word}
.preview{margin-top:12px;display:none}
.preview img{max-width:100%;max-height:300px;border-radius:13px;border:1px solid #284761}
.pdfBox{
  padding:14px;border-radius:13px;background:#0b1722;border:1px solid #284761;color:#b9c7d5
}
.primary{
  width:100%;border:0;border-radius:16px;padding:16px 18px;
  background:linear-gradient(180deg,#1ca7ff,#087fe8);color:#fff;
  font-size:17px;font-weight:900;box-shadow:0 8px 24px rgba(0,126,235,.24)
}
.primary:disabled{opacity:.55;cursor:not-allowed}
.secondary{
  width:100%;border:1px solid #31536e;border-radius:14px;padding:13px;
  background:#0a1722;color:#dce8f3;font-weight:800
}
.status{
  display:none;margin-top:14px;padding:14px;border-radius:14px;border:1px solid #31536e;
  background:#08131e;color:#b8c8d8;line-height:1.45
}
.status.error{display:block;border-color:#8b2929;background:#180b0d;color:#ffb0b0}
.status.ok{display:block;border-color:#2f7432;background:#0a180c;color:#b9efb0}
.status.loading{display:block}
.spinner{
  display:inline-block;width:17px;height:17px;border:2px solid #59748a;border-top-color:#fff;
  border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.resultTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#103b26;color:#9bf08b}
.resultBlock{padding:13px 0;border-top:1px solid #1d3447}
.resultBlock:first-child{border-top:0}
.resultBlock h3{font-size:15px;margin:0 0 8px;color:#dfeaf4}
.resultBlock p{margin:0;color:#c5d1dc;line-height:1.52;white-space:pre-wrap}
ul{margin:7px 0 0;padding-left:21px;color:#c5d1dc}
li{margin:6px 0;line-height:1.45}
.op{
  border:1px solid #28475e;border-radius:13px;padding:12px;margin-top:9px;background:#091520
}
.op b{color:#fff}.op small{display:block;color:#aebdca;margin-top:5px;line-height:1.45}
.tool{
  border:1px solid #28475e;border-radius:13px;padding:12px;margin-top:9px;background:#091520
}
.toolTop{font-weight:900;color:#fff;margin-bottom:7px}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:#b9c8d5;font-size:13px}
.toolGrid div{padding:7px 8px;background:#0d1b28;border-radius:8px}
.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(5,10,16,.94);border-top:1px solid #203548;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.navBtn{
  border:0;background:transparent;color:#91a6b9;padding:8px 4px;border-radius:12px;font-size:12px;font-weight:800
}
.navBtn.active{color:#20a8ff;background:#091a28}
.navIcon{font-size:19px;display:block;margin-bottom:2px}
.notice{font-size:12px;color:#91a4b5;line-height:1.45;margin-top:10px}
@media(max-width:520px){
  main{padding:12px}.card{padding:15px}.grid{grid-template-columns:1fr}
  header{padding-top:18px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">CNC AI <span>TECHNOLÓG</span> <small style="font-size:12px;color:#6f8294">V3</small></div>
  <div class="sub">AI technologický asistent pre CNC výrobu</div>
</header>

<main id="newOrder">
  <section class="card">
    <h2>Nová technologická analýza</h2>

    <div class="field">
      <label for="operation">Typ obrábania</label>
      <select id="operation">
        <option value="Sústruženie">Sústruženie</option>
        <option value="Frézovanie">Frézovanie</option>
      </select>
    </div>

    <div class="grid">
      <div class="field">
        <label for="material">Materiál</label>
        <input id="material" type="text" value="C45" placeholder="napr. C45, 42CrMo4, S355">
      </div>
      <div class="field">
        <label for="stock">Polotovar</label>
        <input id="stock" type="text" value="D220/275" placeholder="napr. D220/275">
      </div>
    </div>

    <div class="field">
      <label for="machine">Stroj / riadenie</label>
      <input id="machine" type="text" value="Fanuc" placeholder="napr. Fanuc">
    </div>

    <div class="field">
      <label>Technický výkres</label>
      <div class="drop" id="drop">
        <label for="file" class="dropBtn">📎 Vybrať výkres</label>
        <input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp">
        <div class="fileName" id="fileName">PDF, PNG, JPG/JPEG alebo WEBP</div>
        <div class="preview" id="preview"></div>
      </div>
      <div class="notice">Výkres sa odošle priamo na existujúci backend <b>/api/analyze</b>. API kľúč zostáva na serveri.</div>
    </div>

    <div class="field">
      <label for="requirements">Ďalšie požiadavky</label>
      <textarea id="requirements" placeholder="Tolerancie, drsnosť, dostupné nástroje, špeciálne požiadavky..."></textarea>
    </div>

    <button class="primary" id="analyzeBtn" type="button">🤖 SPUSTIŤ AI ANALÝZU</button>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="resultCard">
    <div class="resultTitle">
      <h2 style="margin:0">Výsledok analýzy</h2>
      <span class="pill">AI ANALÝZA</span>
    </div>
    <div id="result"></div>
  </section>
</main>

<div class="bottom">
  <div class="bottomInner">
    <button class="navBtn active" id="navNew" type="button"><span class="navIcon">＋</span>NOVÁ ANALÝZA</button>
    <button class="navBtn" id="navResult" type="button"><span class="navIcon">▣</span>VÝSLEDOK</button>
    <button class="navBtn" id="navTop" type="button"><span class="navIcon">⌃</span>HORE</button>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
let selectedFile = null;

function setStatus(message, type='') {
  const el=$('status');
  el.className='status '+type;
  el.innerHTML=message;
}

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function listHtml(arr) {
  if (!Array.isArray(arr) || !arr.length) return '<p>NIE JE UVEDENÉ/ČITATEĽNÉ</p>';
  return '<ul>'+arr.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>';
}

function renderResult(data) {
  const setup=data.setup || {};
  const ops=Array.isArray(data.operations)?data.operations:[];
  const tools=Array.isArray(data.tools)?data.tools:[];
  const critical=data.critical_dimensions||[];
  const warnings=data.warnings||[];
  const notes=data.notes||[];

  let html='';
  html += block('Čítanie výkresu', `<p>${escapeHtml(data.drawing_read || 'NIE JE UVEDENÉ/ČITATEĽNÉ')}</p>`);
  html += block('Upnutie a dátumy',
    `<p><b>Upnutie:</b> ${escapeHtml(setup.clamping||'NIE JE UVEDENÉ/ČITATEĽNÉ')}</p>
     <p style="margin-top:7px"><b>Dátum:</b> ${escapeHtml(setup.datum||'NIE JE UVEDENÉ/ČITATEĽNÉ')}</p>
     <p style="margin-top:7px"><b>Opory:</b> ${escapeHtml(setup.supports||'NIE JE UVEDENÉ/ČITATEĽNÉ')}</p>
     <p style="margin-top:7px"><b>Riziká:</b> ${escapeHtml(setup.risks||'NIE JE UVEDENÉ/ČITATEĽNÉ')}</p>`
  );
  html += block('Technologický postup',
    ops.length ? ops.map(o=>`<div class="op"><b>${escapeHtml(o.order)}. ${escapeHtml(o.name)}</b><small>${escapeHtml(o.description)}</small></div>`).join('') : '<p>NIE JE UVEDENÉ/ČITATEĽNÉ</p>'
  );
  html += block('Nástroje a štartovacie parametre',
    tools.length ? tools.map(t=>`<div class="tool">
      <div class="toolTop">${escapeHtml(t.operation)}</div>
      <div class="toolGrid">
        <div><b>Nástroj:</b> ${escapeHtml(t.tool)}</div>
        <div><b>Držiak:</b> ${escapeHtml(t.holder)}</div>
        <div><b>Plátok:</b> ${escapeHtml(t.insert)}</div>
        <div><b>Vc:</b> ${escapeHtml(t.vc)}</div>
        <div><b>Posuv:</b> ${escapeHtml(t.feed)}</div>
        <div><b>Otáčky:</b> ${escapeHtml(t.rpm)}</div>
      </div>
    </div>`).join('') : '<p>NIE JE UVEDENÉ/ČITATEĽNÉ</p>'
  );
  html += block('Kritické rozmery na kontrolu', listHtml(critical));
  html += block('Upozornenia a riziká', listHtml(warnings));
  html += block('Poznámky', listHtml(notes));

  $('result').innerHTML=html;
  $('resultCard').classList.remove('hidden');
}

function block(title, body) {
  return `<div class="resultBlock"><h3>${escapeHtml(title)}</h3>${body}</div>`;
}

function fileToDataURL(file) {
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error('Nepodarilo sa načítať výkres.'));
    r.readAsDataURL(file);
  });
}

$('file').addEventListener('change', async e => {
  selectedFile=e.target.files?.[0]||null;
  $('preview').style.display='none';
  $('preview').innerHTML='';
  if(!selectedFile){$('fileName').textContent='PDF, PNG, JPG/JPEG alebo WEBP';return}
  $('fileName').textContent=selectedFile.name;

  if(selectedFile.type.startsWith('image/')){
    const url=URL.createObjectURL(selectedFile);
    $('preview').innerHTML=`<img src="${url}" alt="Náhľad výkresu">`;
    $('preview').style.display='block';
  } else {
    $('preview').innerHTML='<div class="pdfBox">📄 PDF výkres pripravený na odoslanie</div>';
    $('preview').style.display='block';
  }
});

const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>{
  const f=e.dataTransfer.files?.[0];
  if(f){
    $('file').files=e.dataTransfer.files;
    $('file').dispatchEvent(new Event('change'));
  }
});

$('analyzeBtn').addEventListener('click', async ()=>{
  if(!selectedFile){
    setStatus('❌ Najprv vyber technický výkres (PDF, PNG, JPG/JPEG alebo WEBP).','error');
    return;
  }
  if(selectedFile.size > 4.2*1024*1024){
    setStatus('❌ Súbor je príliš veľký pre odoslanie cez Vercel. Skús PDF/obrázok do približne 4 MB.','error');
    return;
  }

  $('analyzeBtn').disabled=true;
  setStatus('<span class="spinner"></span>AI číta výkres a pripravuje technológiu…','loading');
  $('resultCard').classList.add('hidden');

  try{
    const fileData=await fileToDataURL(selectedFile);
    const payload={
      type:$('operation').value,
      operation:$('operation').value,
      material:$('material').value.trim(),
      stock:$('stock').value.trim(),
      machine:$('machine').value.trim(),
      requirements:$('requirements').value.trim(),
      fileName:selectedFile.name,
      fileData:fileData
    };

    const response=await fetch('/api/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    let data=null;
    try{data=await response.json()}catch(_){}

    if(!response.ok || !data || data.success!==true){
      const msg=data?.error || `Server odpovedal HTTP ${response.status}.`;
      const details=data?.details ? `<br><small>${escapeHtml(data.details)}</small>` : '';
      throw new Error(msg+details);
    }

    renderResult(data);
    setStatus('✅ Analýza bola úspešne dokončená.','ok');
    setTimeout(()=>$('resultCard').scrollIntoView({behavior:'smooth',block:'start'}),120);
  }catch(err){
    setStatus('❌ '+(err.message||'Analýza zlyhala.')+
      '<br><small>Ak starý index.html fungoval, backend /api/analyze zostáva zachovaný. Skontroluj, či je tento súbor nasadený v tom istom Vercel projekte ako priečinok /api.</small>','error');
  }finally{
    $('analyzeBtn').disabled=false;
  }
});

$('navNew').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
$('navResult').onclick=()=>{
  if(!$('resultCard').classList.contains('hidden')) $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
  else setStatus('Výsledok sa zobrazí po úspešnej AI analýze.','');
};
$('navTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
